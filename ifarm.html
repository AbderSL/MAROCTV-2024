<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بث مباشر - تمازيغت</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0d0d0d;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .player-container {
    width: 100%;
    max-width: 960px;
    background: #1a1a1a;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .player-header {
    padding: 16px 20px;
    background: linear-gradient(90deg, #b91c1c, #7f1d1d);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .player-header h1 {
    font-size: 18px;
    font-weight: 600;
  }

  .live-badge {
    background: #dc2626;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    animation: blink 1.4s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* نسبة 16:9 */
    background: #000;
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .player-footer {
    padding: 12px 20px;
    color: #999;
    font-size: 13px;
    text-align: center;
    border-top: 1px solid #262626;
  }

  .player-footer a {
    color: #ef4444;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="player-container">
  <div class="player-header">
    <h1>قناة تمازيغت - بث مباشر</h1>
    <span class="live-badge"><span class="live-dot"></span> مباشر</span>
  </div>

  <div class="video-wrapper">
    <iframe
      src="https://www.elahmad.ru/tv/arabic-tv-online.php?id=tamazight"
      allowfullscreen
      allow="autoplay; encrypted-media; picture-in-picture"
      referrerpolicy="no-referrer-when-downgrade"
      loading="lazy">
    </iframe>
  </div>

  <div class="player-footer">
    المصدر: <a href="https://www.elahmad.ru/tv/arabic-tv-online.php?id=tamazight" target="_blank">elahmad.ru</a>
  </div>
</div>

</body>
</html>
