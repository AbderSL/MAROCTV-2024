<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاهدة القناة</title>

<style>
  body {
    margin: 0;
    background-color: #000;
    color: #fff;
    font-family: "Arial", sans-serif;
    text-align: center;
  }

  header {
    background: #222;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  header img {
    width: 36px;
    height: 36px;
    border-radius: 8px;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
  }

  video {
    width: 100%;
    height: auto;
    background: #000;
  }

  iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    display: block;
  }

  .live {
    position: absolute;
    top: 12px;
    left: 12px;
    background: red;
    color: white;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
  }

  .container {
    position: relative;
  }

  .status {
    padding: 12px;
    font-size: 14px;
    color: #ccc;
  }
</style>
</head>
<body>

<header>
  <img id="logo" src="https://AbderSL.github.io/MarocTV-2022/LOGO/7.jpg" alt="logo">
  <h1 id="title">القناة</h1>
</header>

<div class="container">
  <span class="live">LIVE</span>
  <!--
    نستخدم بث يوتيوب الرسمي للقناة الثانية (2M) مباشرة.
    Channel ID: UCvbrGTGpXtCZNbCvfjr_aew  (Handle: @2mmaroc32)
    autoplay=1 + mute=1 ضروريان لكي يعمل التشغيل التلقائي في أغلب المتصفحات.
  -->
  <iframe
    id="player"
    src="https://www.youtube.com/embed/live_stream?channel=UCvbrGTGpXtCZNbCvfjr_aew&autoplay=1&mute=1"
    title="2M Maroc Live"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>

</body>
</html>
